l_english:
TNC_bitter_loser:0 "Bitter Loser"
TNC_bitter_loser_desc:0 "Having lost the Second World War against the forces of Germany, France has moved to revanchist lengths, though it is Socialist. This has lead to a weird mix of Nationalist and Socialist elements, akin to Socialism in One State where the Revolution is now exclusively Paris focused."
TNC_rampant_corruption:0 "Rampant Corruption"
TNC_rampant_corruption_desc:0 "Having just risen to power, Picasso's Government still carries the burdens and sins of the previous Governments. Rather than letting their lives away for the good of the Revolution, several ministers are looting the treasuries and using bribes to get to riches. If this is not dealt with sooner than later, France will never recover."
TNC_french_mafia:0 "French Mafia"
TNC_french_mafia_desc:0 "Similar to Italy, several bandit gangs have begun to plague the French countryside. Since our Army is a bit defunct because of... Germanic victories, they have almost free reign on France. The first objective must be to allocate Internationale resources to dealing with anti-socialist scum!"
TNC_the_jewish_haven:0 "The Jewish Haven"
TNC_the_jewish_haven_desc:0 "This Country is home to many displaced Jews from the War and rising anti-semetic cultures around the World."
TNC_bastion_of_western_socialism:0 "Bastion Of Western Socialism"
TNC_bastion_of_western_socialism_desc:0 "With the fall of the USSR, France has remained the last bastion of Socialism in the Earth. With itself and the remaining left leaning powers, the Western European Proleteriat remains united."
TNC_the_artists_state:0 "The Artist State"
TNC_the_artists_state_desc:0 "Artistry is valued... Uniquely in French politics. As one might say, its job is to comfort the disturbed and disturbed the comfortable. As a result, Art is used in all sorts of French propaganda, entertainment and secret agencies. A preferrence is put on Cubist art, but sometimes it is enforced."
