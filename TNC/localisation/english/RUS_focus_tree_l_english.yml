l_english:
 RUS_empire_strikes_back: "The Empire Strikes Back"
 RUS_empire_strikes_back_desc: "The old order reasserts itself over Vyatka."

 RUS_but_not_the_emperor: "But Not the Emperor"
 RUS_but_not_the_emperor_desc: "The Tsar's throne is restored, but the man himself will not sit on it again."

 RUS_combatting_depression: "Combatting Depression"
 RUS_combatting_depression_desc: "The economic malaise weighs heavily on the people. Something must be done to lift spirits."

 RUS_new_regime_old_problems: "New Regime, Old Problems"
 RUS_new_regime_old_problems_desc: "The restoration inherits all the unresolved tensions of the old empire."

 RUS_restructure_imperial_economy: "Restructure the Imperial Economy"
 RUS_restructure_imperial_economy_desc: "The economy must be rebuilt on a foundation suited to the new era."

 RUS_ever_heard_of_tetris: "Ever Heard of Tetris?"
 RUS_ever_heard_of_tetris_desc: "A curious pastime is spreading among the people."

 RUS_take_a_break: "Take a Break"
 RUS_take_a_break_desc: "Sometimes the best policy is to simply let people breathe."

 RUS_boost_morale_through_games: "Boost Morale Through Games"
 RUS_boost_morale_through_games_desc: "Simple entertainment can do wonders for public spirit."

 RUS_1917_never_again: "1917 Never Again"
 RUS_1917_never_again_desc: "Lessons from the revolution must never be forgotten."

 RUS_ensuring_the_tsars_safety: "Ensuring the Tsar's Safety"
 RUS_ensuring_the_tsars_safety_desc: "Security above all else."

 RUS_a_more_natural_role: "A More Natural Role"
 RUS_a_more_natural_role_desc: "Perhaps games are best left to the people, not the state."

 RUS_restore_the_zemsky_sobor: "Restore the Zemsky Sobor"
 RUS_restore_the_zemsky_sobor_desc: "The old consultative assembly is revived."

 RUS_visit_the_people_1: "Visit the People"
 RUS_visit_the_people_1_desc: "Direct contact with the people builds trust."

 RUS_dabble_in_literary_arts: "Dabble in Literary Arts"
 RUS_dabble_in_literary_arts_desc: "Culture and letters flourish under a period of calm."

 RUS_visit_the_people_2: "Visit the People"
 RUS_visit_the_people_2_desc: "Further tours strengthen the bond between throne and subject."

 RUS_progress: "Progress?"
 RUS_progress_desc: "A new generation of writers questions the path forward."

 RUS_god_save_the_tsar: "God Save the Tsar!"
 RUS_god_save_the_tsar_desc: "The people's faith in the crown is renewed."

 RUS_fate_of_the_okhrana: "Fate of the Okhrana"
 RUS_fate_of_the_okhrana_desc: "The secret police's future must be decided."

 RUS_reconvene_the_old_ways: "Reconvene the Old Ways"
 RUS_reconvene_the_old_ways_desc: "The old methods of surveillance and control are restored."

 RUS_focus_on_social_security: "Focus on Social Security"
 RUS_focus_on_social_security_desc: "Resources are redirected from repression to welfare."

 RUS_tackle_anti_tsarist_sentiment: "Tackle Anti-Tsarist Sentiment"
 RUS_tackle_anti_tsarist_sentiment_desc: "Dissent still simmers beneath the surface."

 RUS_watch_over_any_suspects: "Watch Over Any Suspects"
 RUS_watch_over_any_suspects_desc: "Vigilance is maintained against enemies of the throne."

 RUS_trust_the_process: "Trust the Process"
 RUS_trust_the_process_desc: "Faith is placed in reconciliation rather than suspicion."

 RUS_love_the_tsar_and_the_tsar_will_love_you: "Love the Tsar and the Tsar Will Love You"
 RUS_love_the_tsar_and_the_tsar_will_love_you_desc: "A new social contract is forged between throne and people."

 RUS_mladorossi_economics: "Mladorossi Economics"
 RUS_mladorossi_economics_desc: "A blend of tsarism and socialism is proposed for the economy."

 RUS_free_market_practices: "Free Market Practices"
 RUS_free_market_practices_desc: "Liberal economic reform is favoured instead."

 RUS_nationalise_some_private_property: "Nationalise Some Private Property"
 RUS_nationalise_some_private_property_desc: "Key industries are brought under state control."

 RUS_leave_the_rest_to_the_party: "Leave the Rest to the Party"
 RUS_leave_the_rest_to_the_party_desc: "The remaining sectors are entrusted to party management."

 RUS_limited_corporations: "Limited Corporations"
 RUS_limited_corporations_desc: "A controlled corporate sector is permitted to operate."

 RUS_land_reform: "Land Reform?"
 RUS_land_reform_desc: "The question of land redistribution resurfaces."

 RUS_invite_wineworkers: "Invite Wineworkers"
 RUS_invite_wineworkers_desc: "Skilled labour is welcomed into the agricultural economy."

 RUS_encourage_farm_businesses: "Encourage Farm Businesses"
 RUS_encourage_farm_businesses_desc: "Private agriculture is given room to grow."

 RUS_surplus: "Surplus!"
 RUS_surplus_desc: "Production finally outpaces demand."

 RUS_no_more_grain_crises: "No More Grain Crises"
 RUS_no_more_grain_crises_desc: "Food security is finally achieved."

 RUS_imperial_rebirth: "Imperial Rebirth"
 RUS_imperial_rebirth_desc: "The imperial economy emerges renewed."

 RUS_its_time: "It's Time"
 RUS_its_time_desc: "Vyatka stands ready for what comes next."
