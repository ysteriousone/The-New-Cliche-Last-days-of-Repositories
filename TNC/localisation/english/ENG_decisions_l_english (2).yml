 Malayan_insurgency_cat:0 "The Malayan Insurgency"
 Malayan_insurgency_cat_desc:0 "The Lord Protector’s Vision for the Union of the Anglosphere is one of might and glory under the rightful watching eyes of the British. One can imagine the grandiose of ocean-faring vessels cutting the seas, with warships blessed by the Lord Protector moving abreast. How can one reject His Benevolence, His Vision, His Goal?\n\nAs it turns out, a language alone cannot unify such a vast domain. From the decadent Socialists of Australasia to the rebels of India, from the rotten Cape of Good Hope to the renegades of Canada, many continue their challenge to Him, the Anglosphere’s rightful Lord Protector. And Mosley has declared, once and surely, that the Third Position shall now be in the offensive, that the new sprout of rebellion in Malaya shall be put down – with force, as a warning.\n\n So as the ships and the soldiers of the Lord Protector sail away to Singapore and His Most Loyal Army Staff draw up plans of invasion, as networks of local collaborators are set up alongside torture chambers for the imbeciles, Malaya becomes the proving ground of the Lord Protector’s Vision. For now British radio sets continue the regular routine of praise and victory, and the people listen. But if the people ever stop, one can seldom imagine the tragedy that shall befall this fair nation."
 
