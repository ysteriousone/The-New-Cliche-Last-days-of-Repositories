 VOROSHILOV_DESC:0 "§gBorn:§! 04. 02. 1881., Verkhneye, Bakhmut uezd, Yekaterinoslav Governorate, Russian Empire\n--------------\nKliment Voroshilov’s headquarters in Syktyvkar is the best-maintained building in the best-maintained quarter in the biggest settlement in the entire territory of the North Russian Revolutionary Front, yet the old Marshal never enjoyed working there. In his rare moments of emotions cladded behind a facade of strength, he missed his past life of comparative luxury in Moscow and the days when the Soviet Union used to be a rightful power – an achievement he can proudly boast of his contributions.\n\nHis position at the top of the Front stems from his revolutionary credentials as one of the most important men in Budyonny’s First Cavalry Army – its political commissar. The Commissar of an Army so instrumental in beating the Whites of all stripes quickly became a major figure in the nascent Soviet political system, with the additional distinction of having survived the Great Purge, though his later showings in an age of mechanised warfare led to his effective dismissal from active command.\n\nNonetheless, Voroshilov’s time in the limelight would still have been much longer if not for his sudden appearance in the Northern taigas of a broken Motherland. Having helped bring together the minds and bodies of his people and colleagues in the Front, Voroshilov finds himself respected, though more and more distant from policymaking. As age, pressure and the unpleasant North eat away at his health, Voroshilov’s days may be over soon – and with that, the first real test of the Front shall commence."