l_english:
 West_Russian_unification_cat:0 "Russian Unification - West Russia"
 West_Russian_unification_cat_desc:0 "Beyond the miserable scenery of the Russian Anarchy, what remains of Russia immediately to the east of the A-A Line remains the most developed and industrialised of them all, if not devolved into the sad daily crescendo of gunfire. This hampers our abilities to prove ourselves as much as it does our adversaries, and, as painful as it is, the German OKW continues to laugh at us precisely because.\n\nNonetheless, we have taken our first step in reuniting the vast lands of Russia – and now we lay our righteous embrace on the rusting railroads and hollowed out slums that litter the landscape to the west of the Urals. While this foothold gives us a chance to finally exert our vision over the vast ‘Motherland’, challengers are sure to come to us, salivating over the boons, so let them come.\n\nWe shall prove ourselves, we shall reunite Russia, and we perhaps one day can duly hand the Germans their long-due notice of eviction."
 